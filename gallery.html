---
layout: default
title: Gallery
css: [gallery]
---
{%- comment -%} 갤러리 목록 — _gallery 폴더의 글을 날짜 최신순으로 자동 표시 {%- endcomment -%}
{%- assign gallery = site.gallery | reverse -%}
<div class="main-wrapper">
    <h2 style="border-bottom: 2px solid #003a71; padding-bottom: 10px; color: #003a71; font-weight: 900;">GALLERY</h2>

    <div class="gallery-grid">
{%- for item in gallery %}

        <a href="{{ item.url | relative_url }}" class="gallery-item">
            <div class="gallery-thumbnail">
                <img src="{{ item.image | default: '/images/logo.png' | relative_url }}" alt="{{ item.title | escape }}">
            </div>
            <div class="gallery-info">
                <h3>{{ item.title }}</h3>
                <p class="gallery-date">{{ item.date | date: "%Y-%m-%d" }}</p>
            </div>
        </a>
{%- endfor %}

    </div> </div>
